name: Release

# Run it from the Actions tab ("Run workflow") and type a version like v0.1.0,
# or push a tag that starts with "v".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.0"
        required: true
        default: "v0.1.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Create GitHub release with the built files attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes \
            || gh release upload "$TAG" dist/* --clobber

  # Optional: publish to PyPI so people can `pip install repo-doctor`.
  # Turn on by (1) creating a PyPI "trusted publisher" for this repo and workflow,
  # then (2) adding a repository variable PUBLISH_TO_PYPI = true.
  pypi:
    needs: release
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
